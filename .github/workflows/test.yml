name: Test

on:
  pull_request:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: make install

      # Vitest runs tests through esbuild, which STRIPS types without checking
      # them — so nothing in the suite was type-checked at all. This step
      # compiles it for real.
      - name: Typecheck test suite
        run: pnpm run typecheck:test

      - name: Run unit tests
        run: pnpm run test
