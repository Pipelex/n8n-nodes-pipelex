name: n8n Compliance

on:
  pull_request:

jobs:
  n8n-check:
    name: n8n Lint Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: make install

      - name: Run n8n compliance lint
        run: pnpm run lint:n8n
